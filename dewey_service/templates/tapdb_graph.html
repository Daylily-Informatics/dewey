<!doctype html>
{% from "_chrome.html" import environment_chrome, page_footer %}
<html lang="en" data-lsmc-service="dewey" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dewey TapDB Object Graph</title>
    <link rel="stylesheet" href="{{ static_url('console.css') }}" />
  </head>
  <body>
    {{ environment_chrome(deployment, region, show_environment_chrome) }}
    <main>
      <h1>TapDB Object Graph</h1>
      <p><a href="/tapdb/graph">Open the TapDB graph explorer</a></p>
      <iframe src="/tapdb/graph" title="TapDB graph explorer"
              style="width:100%;height:80vh;border:0"></iframe>
    </main>
    {{ page_footer(git_meta, build_version) }}
  </body>
</html>
