# Dewey Configuration
# ===================
# Create this file with:
#   dewey config init
#
# Stored by default at ~/.config/dewey-<deployment>/dewey-config-<deployment>.yaml unless XDG_CONFIG_HOME is set.
#
# Explicit env contract for TapDB/Meridian subprocesses:
# MERIDIAN_DOMAIN_CODE=D
# TAPDB_APP_CODE=D

application:
  environment: development
  api_bearer_token: dewey-dev-token
  session_secret_key: generated-on-init
  host: 127.0.0.1
  port: 8914
  verify_ssl: true

auth:
  cognito:
    domain: https://dewey-auth.example.com
    app_client_id: dewey-client-id
    app_client_secret: ""
    redirect_uri: https://localhost:8914/auth/callback
    logout_url: https://localhost:8914/login
    user_pool_id: us-west-2_example
    region: us-west-2
    allowed_email_domains:
      - lsmc.com
      - lsmc.bio
      - lsmc.life
      - daylilyinformatics.com
    default_tenant_id: 00000000-0000-0000-0000-000000000000
    auto_provision_allowed_domains:
      - lsmc.com
    group_role_map:
      platform-admin: ADMIN
      dewey-admin: ADMIN
      dewey-readwrite: READ_WRITE
      dewey-readonly: READ_ONLY

database:
  backend: tapdb
  target: local
  client_id: dewey
  namespace: dewey
  env: dev
  # Explicit env contract for TapDB/Meridian subprocesses:
  # MERIDIAN_DOMAIN_CODE=D
  # TAPDB_APP_CODE=D
  config_path: ""

aws:
  profile: ""
  region: us-west-2

storage:
  managed_bucket: ""
  managed_prefix: artifacts
  upload_session_ttl_seconds: 900

deployment:
  name: ""
  color: ""
  is_production: false

network:
  allowed_hosts: []
