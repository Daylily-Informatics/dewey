meta:
  config_version: 3
  client_id: dewey
  database_name: dewey
  owner_repo_name: dewey
  domain_code: Z
  domain_registry_path: ~/.config/tapdb/domain_code_registry.json
  prefix_ownership_registry_path: ~/.config/tapdb/prefix_ownership_registry.json
  # Explicit env contract for TapDB/Meridian subprocesses:
  # MERIDIAN_DOMAIN_CODE=Z
  # TAPDB_OWNER_REPO=dewey
environments:
  dev:
    domain_code: Z
    engine_type: local
    host: localhost
    port: '5439'
    ui_port: '8914'
    database: dewey_dev
    audit_log_euid_prefix: DGX
    support_email: support@lsmc.bio
    cognito_user_pool_id: ''
  prod:
    domain_code: Z
    engine_type: aurora
    host: dewey.cluster-REPLACE.us-west-2.rds.amazonaws.com
    port: '5432'
    ui_port: '8914'
    user: tapdb_admin
    password: ''
    database: dewey_prod
    audit_log_euid_prefix: DGX
    support_email: support@lsmc.bio
    cognito_user_pool_id: ''
    region: us-west-2
    cluster_identifier: dewey
    iam_auth: 'true'
    ssl: 'true'
