# Deprecated example: use `dewey config init` to create the authoritative template.
#
# Explicit env contract for TapDB/Meridian subprocesses:
# MERIDIAN_DOMAIN_CODE=D
# TAPDB_OWNER_REPO=dewey
application:
  environment: development
  api_bearer_token: dewey-dev-token
  session_secret_key: generated-on-init
  host: 127.0.0.1
  port: 8914
  verify_ssl: true

auth:
  cognito:
    domain: https://dewey-auth.example.com
    app_client_id: dewey-client-id
    app_client_secret: ""
    redirect_uri: https://localhost:8914/auth/callback
    logout_url: https://localhost:8914/login
    user_pool_id: us-west-2_example
    region: us-west-2
    allowed_email_domains:
      - lsmc.com
      - lsmc.bio
      - lsmc.life
      - daylilyinformatics.com
    default_tenant_id: 00000000-0000-0000-0000-000000000000
    auto_provision_allowed_domains:
      - lsmc.com

database:
  backend: tapdb
  target: local
  client_id: dewey
  namespace: dewey
  owner_repo_name: dewey
  domain_code: D
  domain_registry_path: ~/.config/tapdb/domain_code_registry.json
  prefix_ownership_registry_path: ~/.config/tapdb/prefix_ownership_registry.json
  env: dev
  # Explicit env contract for TapDB/Meridian subprocesses:
  # MERIDIAN_DOMAIN_CODE=D
  # TAPDB_OWNER_REPO=dewey
  config_path: ~/.config/tapdb/dewey/dewey/tapdb-config.yaml

aws:
  profile: ""
  region: us-west-2

deployment:
  name: ""
  color: ""
  is_production: false
