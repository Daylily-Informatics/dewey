[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dewey-service"
version = "0.3.4"
description = "LSMC Dewey canonical artifact registry service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "cli-core-yo>=0.3.2",
    "daylily-tapdb==3.0.12",
    "daylily-cognito==0.1.33",
    "fastapi>=0.115.0",
    "metapub",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "itsdangerous>=2.2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8.0",
    "build>=1.2.0",
    "playwright>=1.42.0",
    "pre-commit>=3.8.0",
    "pytest>=8.0.0",
    "pytest-playwright>=0.4.4",
    "ruff>=0.9.0",
]

[project.scripts]
dewey = "dewey_service.cli:main"

[tool.setuptools.packages.find]
include = ["dewey_service*"]

[tool.setuptools.package-data]
dewey_service = ["etc/*.yaml", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: marks tests as end-to-end tests requiring playwright",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.bandit]
targets = ["dewey_service"]
exclude_dirs = ["tests", "dist", "build"]
skips = [
    "B105",  # false positives on config field names and placeholder defaults
    "B404",  # CLI wrappers intentionally use subprocess for trusted local tools
    "B603",  # subprocess calls execute trusted local commands without shell=True
]
 
