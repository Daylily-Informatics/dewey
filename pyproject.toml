[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dewey-service"
version = "0.1.0"
description = "LSMC Dewey canonical artifact registry service"
requires-python = ">=3.11"
dependencies = [
    "daylily-tapdb==0.1.35",
    "daylily-cognito==0.1.24",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "itsdangerous>=2.2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
dewey = "dewey_service.cli:main"

[tool.setuptools.packages.find]
include = ["dewey_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
