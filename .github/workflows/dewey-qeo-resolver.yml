name: Publish Dewey QEO resolver image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dewey-qeo-resolver-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AWS_REGION: us-west-2
      ECR_REPOSITORY: dayhoff/day/dewey
      BASE_IMAGE: 108782052779.dkr.ecr.us-west-2.amazonaws.com/dayhoff/day/dewey@sha256:0780a42dd2b3d5620de2c538cada32acd661f5be5a0f0b60a08c9f941ea3af42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::108782052779:role/github-actions-ecr-all-repos
          role-session-name: dewey-qeo-resolver
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Verify exact base source and runtime without starting the application
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          docker pull "$BASE_IMAGE"
          mkdir -p evidence baseline
          git archive dea0009b743ad5b627177acdf21c87dd5c1d67c1 dewey_service | tar -x -C baseline
          docker run --rm --network none --read-only --entrypoint python \
            -v "$PWD/baseline/dewey_service:/baseline:ro" "$BASE_IMAGE" -c '
          import pathlib, hashlib, importlib.metadata as m, json
          expected = pathlib.Path("/baseline")
          actual = pathlib.Path("/app/dewey_service")
          files = list(expected.rglob("*.py"))
          assert files
          for source in files:
              assert source.read_bytes() == (actual / source.relative_to(expected)).read_bytes(), source
          versions = {n:m.version(n) for n in ["dewey-service", "daylily-tapdb", "cli-core-yo", "daylily-auth-cognito"]}
          assert versions == {"dewey-service":"8.0.2", "daylily-tapdb":"9.0.9", "cli-core-yo":"2.1.1", "daylily-auth-cognito":"2.1.5"}
          print(json.dumps({"base_source_matches":True, "python_files":len(files), "versions":versions}))
          ' | tee evidence/base.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/qeo-resolver.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.ecr.outputs.registry }}/dayhoff/day/dewey:qeo-resolver-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/lsmc-bio/dewey
            org.opencontainers.image.version=8.0.2-qeo-resolver
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}
      - name: Verify published source and resolver imports without database access
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/dayhoff/day/dewey@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$GITHUB_SHA"
          docker run --rm --network none --read-only --entrypoint python \
            -e DEWEY_DEPLOYMENT_CODE=day \
            --tmpfs /tmp:rw,mode=1777 \
            -e XDG_CONFIG_HOME=/tmp/dewey/config -e XDG_DATA_HOME=/tmp/dewey/data \
            -e XDG_STATE_HOME=/tmp/dewey/state -e XDG_CACHE_HOME=/tmp/dewey/cache \
            -v "$PWD/dewey_service:/expected:ro" "$IMAGE" -c '
          import pathlib, json
          from dewey_service.qeo_package_contract import ResolveMultiqcRequest, PackageRegistration
          from dewey_service.qeo_resolver_auth import require_qeo_resolver_auth
          from dewey_service.service import DeweyService
          from dewey_service.cli import app
          expected = pathlib.Path("/expected")
          actual = pathlib.Path("/app/dewey_service")
          for source in expected.rglob("*.py"):
              assert source.read_bytes() == (actual / source.relative_to(expected)).read_bytes(), source
          assert callable(DeweyService.resolve_qeo_package)
          print(json.dumps({"candidate_source_matches":True, "resolver_imports":True}))
          ' | tee evidence/candidate.json
          printf '{"source_commit":"%s","image":"%s","base":"%s"}\n' "$GITHUB_SHA" "$IMAGE" "$BASE_IMAGE" > evidence/receipt.json
          printf 'Dewey image: `%s`\nSource: `%s`\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dewey-qeo-resolver-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
