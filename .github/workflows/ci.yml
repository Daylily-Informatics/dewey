name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install frozen project dependencies
        run: |
          python -m pip install uv==0.5.30
          uv sync --frozen

      - name: Run Ruff check
        run: uv run --frozen ruff check dewey_service tests

      - name: Run Ruff format check
        run: uv run --frozen ruff format --check dewey_service tests

  security:
    name: Security Scanning (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install frozen project dependencies
        run: |
          python -m pip install uv==0.5.30
          uv sync --frozen

      - name: Run Bandit security scan
        run: uv run --frozen bandit -c pyproject.toml -r dewey_service

  test:
    name: Tests and Build
    runs-on: ubuntu-latest
    needs: [lint, security]
    env:
      DEWEY_DEPLOYMENT_CODE: ci
      DEPLOYMENT_CODE: ci
      LSMC_DEPLOYMENT_CODE: ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install uv==0.5.30
          uv sync --frozen

      - name: Install Playwright browsers
        run: uv run --frozen python -m playwright install --with-deps chromium

      - name: Run tests
        run: uv run --frozen pytest

      - name: Build package
        run: uv run --frozen python -m build
