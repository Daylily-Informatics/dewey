name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install frozen project dependencies
        run: |
          python -m pip install uv==0.5.30
          uv sync --frozen

      - name: Run Ruff check
        run: uv run --frozen ruff check dewey_service tests

      - name: Run Ruff format check
        run: uv run --frozen ruff format --check dewey_service tests

  security:
    name: Security Scanning (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install frozen project dependencies
        run: |
          python -m pip install uv==0.5.30
          uv sync --frozen

      - name: Run Bandit security scan
        run: uv run --frozen bandit -c pyproject.toml -r dewey_service

  test:
    name: Tests and Build
    runs-on: ubuntu-latest
    needs: [lint, security]
    env:
      DEWEY_DEPLOYMENT_CODE: ci
      DEPLOYMENT_CODE: ci
      LSMC_DEPLOYMENT_CODE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install uv==0.5.30
          uv sync --frozen

      - name: Install Playwright browsers
        run: uv run --frozen python -m playwright install --with-deps chromium

      - name: Run tests
        run: >-
          uv run --frozen pytest --ignore=tests/test_sharing_v3_postgres.py
          --cov=dewey_service --cov-branch --cov-report=json:sharing-coverage.json

      - name: Require 80 percent changed sharing lines and branches
        run: >-
          uv run --frozen python scripts/check_changed_coverage.py
          --baseline 11.0.10 --source dewey_service
          --coverage-json sharing-coverage.json --output sharing-coverage-gate.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked UI coverage tools
        run: npm ci --prefix tests/ui --ignore-scripts --no-audit --no-fund

      - name: Exercise shipped sharing UI handlers
        run: >-
          tests/ui/node_modules/.bin/c8 --all
          --include='dewey_service/static/recipient-account.js'
          --include='dewey_service/static/sharing.js'
          --include='dewey_service/static/registry.js'
          --reporter=json --reports-dir=sharing-ui-coverage
          node --test tests/ui/sharing_v12.test.cjs

      - name: Require 80 percent changed browser lines and branches
        run: >-
          uv run --frozen python scripts/check_changed_coverage.py
          --format istanbul --baseline 11.0.10 --source dewey_service/static
          --coverage-json sharing-ui-coverage/coverage-final.json
          --output sharing-ui-coverage-gate.json

      - name: Retain coverage receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharing-coverage
          path: |
            sharing-coverage*.json
            sharing-ui-coverage-gate.json
            sharing-ui-coverage/coverage-final.json

      - name: Build package
        run: uv run --frozen python -m build

  native-sharing-contracts:
    name: Isolated PostgreSQL sharing contracts
    runs-on: ubuntu-24.04
    needs: [lint, security]
    env:
      DEWEY_DEPLOYMENT_CODE: ci
      DEPLOYMENT_CODE: ci
      LSMC_DEPLOYMENT_CODE: ci
      DEWEY_TEST_DATABASE_DSN: postgresql://dewey12_runtime@localhost:54389/dewey12_contract
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies and native PostgreSQL tools
        run: |
          python -m pip install uv==0.5.30
          uv sync --frozen
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
      - name: Create a new explicit local TapDB contract database
        run: >-
          uv run --frozen python docs/plans/20261026_dewey12_prepare_contract_db.py
          --root "$RUNNER_TEMP/dewey-sharing-contract" --repo "$GITHUB_WORKSPACE"
          --postgres-bin /usr/lib/postgresql/16/bin
      - name: Exercise native claims, revisions, lineage and preserving conversion
        env:
          DEWEY_TEST_TAPDB_CONFIG: ${{ runner.temp }}/dewey-sharing-contract/tapdb.yaml
          XDG_STATE_HOME: ${{ runner.temp }}/dewey-sharing-contract/state
        run: uv run --frozen pytest tests/test_sharing_v3_postgres.py --junitxml=native-sharing-contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sharing-contracts
          path: native-sharing-contracts.xml
